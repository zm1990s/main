<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 100%);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 0, 0.03) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(255, 0, 0, 0.03) 3px
                );
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }

        .container {
            text-align: center;
            z-index: 1;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            92% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(2px, -2px);
            }
            96% {
                transform: translate(-2px, -2px);
            }
            98% {
                transform: translate(2px, 2px);
            }
        }

        h1 {
            color: #ff0000;
            font-size: 4rem;
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 30px #ff0000,
                0 0 40px #ff0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 30px #ff0000,
                    0 0 40px #ff0000;
            }
            50% {
                opacity: 0.8;
                text-shadow: 
                    0 0 5px #ff0000,
                    0 0 10px #ff0000,
                    0 0 15px #ff0000,
                    0 0 20px #ff0000;
            }
        }

        .bomb {
            font-size: 12rem;
            margin: 2rem 0;
            animation: shake 0.5s infinite;
            filter: drop-shadow(0 0 20px #ff6600);
        }

        @keyframes shake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .countdown {
            font-size: 8rem;
            color: #ff3333;
            font-weight: bold;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff0000;
            margin: 2rem 0;
            font-family: 'Courier New', monospace;
        }

        .face {
            font-size: 15rem;
            display: none;
            animation: explode 0.5s ease-out;
        }

        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .warning-text {
            color: #ffaa00;
            font-size: 1.5rem;
            margin-top: 2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ffaa00;
        }

        /* Red alert flash */
        @keyframes alert-flash {
            0%, 100% {
                background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 100%);
            }
            50% {
                background: linear-gradient(135deg, #2a0000 0%, #0a0a0a 100%);
            }
        }

        body.alert {
            animation: alert-flash 0.5s infinite;
        }

        body.exploded {
            background: linear-gradient(135deg, #ff0000 0%, #000000 100%);
            animation: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You've Been Hacked!</h1>
        <div class="bomb" id="bomb">💣</div>
        <div class="countdown" id="countdown">10</div>
        <div class="face" id="face">😵</div>
        <div class="warning-text">SYSTEM COMPROMISED</div>
    </div>

    <script>
        let count = 10;
        const countdownEl = document.getElementById('countdown');
        const bombEl = document.getElementById('bomb');
        const faceEl = document.getElementById('face');
        const body = document.body;

        const timer = setInterval(() => {
            count--;
            countdownEl.textContent = count;

            // Add alert class when countdown is low
            if (count <= 5) {
                body.classList.add('alert');
            }

            // Speed up shake when time is running out
            if (count <= 3) {
                bombEl.style.animation = 'shake 0.2s infinite';
            }

            if (count === 0) {
                clearInterval(timer);
                bombEl.style.display = 'none';
                countdownEl.style.display = 'none';
                faceEl.style.display = 'block';
                body.classList.remove('alert');
                body.classList.add('exploded');
            }
        }, 1000);
    </script>
</body>
</html>
