<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY BREACH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 基础扫描线 */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 0, 0, 0.05) 0px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        .container {
            text-align: center;
            z-index: 5;
            transition: all 0.2s;
        }

        h1 {
            color: #ff0000;
            font-size: clamp(2.5rem, 7vw, 5rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #ff0000;
            margin-bottom: 20px;
            animation: text-glitch 2s infinite;
        }

        .bomb {
            font-size: 8rem;
            margin: 20px 0;
            filter: drop-shadow(0 0 20px #ff0000);
            animation: shake 0.15s infinite;
        }

        .countdown {
            font-size: 7rem;
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000;
            font-family: 'Orbitron', sans-serif; /* 如果有的话 */
        }

        .encryption-text {
            color: #ffaa00;
            font-size: 1.2rem;
            margin-top: 30px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ffaa00;
            font-weight: bold;
        }

        /* --- 模拟碎裂核心层 --- */
        
        /* 1. 碎裂玻璃图层 */
        .crack-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            pointer-events: none;
            display: none;
            background-image: 
                url('https://www.transparentpng.com/download/glass-shatter/broken-glass-cracked-free-clipart-hd-18.png'),
                url('https://www.transparentpng.com/download/glass-shatter/glass-shatter-cracked-images-9.png');
            background-size: cover;
            background-position: center;
            filter: brightness(1.2) contrast(1.2);
        }

        /* 2. 液晶坏线层 */
        .lcd-damage {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, 
                transparent 0%, 
                transparent 10%, 
                rgba(0, 255, 255, 0.1) 10.1%, 
                rgba(255, 0, 255, 0.1) 10.2%, 
                transparent 10.3%
            );
            z-index: 998;
            display: none;
        }

        /* 3. 冲击闪烁 */
        .impact-flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }

        /* 动画关键帧 */
        @keyframes shake {
            0% { transform: translate(0,0) rotate(0); }
            25% { transform: translate(3px, 3px) rotate(1deg); }
            50% { transform: translate(-3px, -3px) rotate(-1deg); }
            75% { transform: translate(-3px, 3px) rotate(1deg); }
            100% { transform: translate(0,0) rotate(0); }
        }

        @keyframes text-glitch {
            0%, 100% { transform: skew(0); }
            95% { transform: skew(10deg); color: #ff0000; }
            96% { transform: skew(-10deg); color: #00ffff; }
            97% { transform: skew(0); }
        }

        /* 爆炸后的全局效果 */
        .broken-active {
            animation: heavy-shake 0.1s infinite;
            filter: hue-rotate(10deg) contrast(1.5);
        }

        @keyframes heavy-shake {
            0% { transform: translate(0,0); }
            50% { transform: translate(5px, -5px); }
            100% { transform: translate(-5px, 5px); }
        }
    </style>
</head>
<body>

    <div class="impact-flash" id="flash"></div>
    <div class="crack-layer" id="crackLayer"></div>
    <div class="lcd-damage" id="lcdDamage"></div>

    <div class="container" id="ui">
        <h1>You've Been Hacked!</h1>
        <div class="bomb" id="bomb">💣</div>
        <div class="countdown" id="countDisplay">10</div>
        <div class="encryption-text">All your files are being encrypted.</div>
    </div>

    <script>
        let count = 10;
        const countDisplay = document.getElementById('countDisplay');
        const bomb = document.getElementById('bomb');
        const flash = document.getElementById('flash');
        const crackLayer = document.getElementById('crackLayer');
        const lcdDamage = document.getElementById('lcdDamage');
        const ui = document.getElementById('ui');

        // 点击页面进入全屏
        document.body.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }, { once: true });

        const timer = setInterval(() => {
            count--;
            countDisplay.textContent = count;

            // 越接近 0 越红，抖动越快
            if (count <= 5) {
                document.body.style.background = count % 2 === 0 ? '#200' : '#050505';
                bomb.style.animationDuration = '0.05s';
                bomb.style.transform = 'scale(1.2)';
            }

            if (count <= 0) {
                clearInterval(timer);
                triggerExplosion();
            }
        }, 1000);

        function triggerExplosion() {
            // 1. 产生冲击闪烁
            flash.style.opacity = '1';
            
            // 2. 瞬间切换状态
            setTimeout(() => {
                // 隐藏炸弹和倒计时
                ui.style.display = 'none';
                
                // 显示裂缝和坏线
                crackLayer.style.display = 'block';
                lcdDamage.style.display = 'block';
                
                // 整个 body 开始高频抖动
                document.body.classList.add('broken-active');
                
                // 模拟蓝屏后的报错文字（可选）
                const errorMsg = document.createElement('div');
                errorMsg.style.cssText = "color:white; font-size:1.5rem; text-align:center; z-index:1001; position:relative; padding: 20px;";
                errorMsg.innerHTML = "CRITICAL_PROCESS_DIED<br>ERROR CODE: 0x000000EF";
                document.body.appendChild(errorMsg);

                // 渐隐白色闪烁层
                setTimeout(() => {
                    flash.style.transition = 'opacity 1s';
                    flash.style.opacity = '0';
                }, 100);

                // 模拟触觉反馈
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                
            }, 50); 
        }
    </script>
</body>
</html>
